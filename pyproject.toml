[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "max-assistant"
version = "0.1.0"
description = "Max personal AI assistant"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7",
    "textual>=0.80",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-groq>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-mcp-adapters>=0.3",
    "python-dotenv>=1.0",
    "sounddevice>=0.5.1",
    "parakeet-mlx>=0.7.0",
]

[project.scripts]
max = "cli.app:run"

[tool.setuptools.packages.find]
include = ["ai*", "cli*"]

[tool.setuptools.package-data]
cli = ["styles/*.tcss"]
