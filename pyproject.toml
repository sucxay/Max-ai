[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "max-assistant"
version = "0.1.0"
description = "Max personal AI assistant"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-groq>=1.0",
    "langchain-mcp-adapters>=0.3",
    "python-dotenv>=1.0",
]

[project.scripts]
max = "cli.interface:run"

[tool.setuptools.packages.find]
include = ["ai*", "cli*"]
