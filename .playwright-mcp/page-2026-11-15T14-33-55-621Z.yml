              - paragraph [ref=e138]: The present Executive team comprises luminaries having vast experience in different fields from legal to education.
              - paragraph [ref=e139]: NGIT is a sister concern of KMIT and all the facilities and successful teaching-learning processes of KMIT are being implemented in this college too.
